   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Cthulhu 7e - Investigator Sheet</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f1ea; --border-color: #2c3e50;
            --header-bg: #1a252f; --text-light: #ecf0f1; --calc-bg: #e0e0e0;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background-color: var(--bg-color); color: #333; margin: 0; padding: 10px; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.2); border: 2px solid var(--border-color); }
        
        .header-wrapper { position: relative; text-align: center; border-bottom: 3px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-size: 2em; text-transform: uppercase; margin: 10px 0 0 0; }
        .lang-toggle { position: absolute; top: 0; right: 0; background-color: #34495e; color: white; padding: 5px 10px; border: none; cursor: pointer; border-radius: 3px;}

        .section-title { background-color: var(--header-bg); color: var(--text-light); padding: 8px 15px; font-size: 1.2em; margin: 20px 0 10px 0; text-transform: uppercase; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; text-align: center;}
        
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; font-size: 0.9em; margin-bottom: 3px; }
        
        input[type="text"], input[type="password"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Arial', sans-serif; width: 100%; }
        
        /* FIX: Remove browser arrows from number fields and adjust spacing */
        input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Arial', sans-serif; width: 100%; -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .stat-group { display: flex; justify-content: center; gap: 3px; margin-top: 5px; }
        .stat-group input { text-align: center; font-family: 'Arial', sans-serif; padding: 4px; }
        .stat-group input.base { width: 50%; font-size: 1.2em; font-weight: bold; }
        .stat-group input.derived { width: 25%; font-size: 0.9em; background-color: var(--calc-bg); cursor: not-allowed; }
        
        .stat-box { border: 2px solid var(--border-color); padding: 10px; text-align: center; border-radius: 5px; }
        .stat-box label { font-size: 1.1em; display: block; font-weight: bold;}
        
        .skill-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 5px 0;}
        .skill-row label { font-size: 0.9em; width: 60%; }
        .skill-row .stat-group { width: 40%; margin-top: 0; justify-content: flex-end; }
        .skill-row .stat-group input.base { width: 45px; font-size: 1em; }
        .skill-row .stat-group input.derived { width: 35px; }

        .controls { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 15px; background: #e8e8e8; border-radius: 5px; }
        button { padding: 10px 15px; font-size: 0.9em; font-weight: bold; cursor: pointer; background-color: var(--header-bg); color: white; border: none; border-radius: 5px; flex-grow: 1; text-align: center; }
        button:hover { background-color: #2c3e50; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 5px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content h3 { margin-top: 0; }
        .modal-content select, .modal-content input { margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; }

        @media (max-width: 768px) {
            .grid-3 { grid-template-columns: 1fr 1fr; }
            .grid-8 { grid-template-columns: repeat(4, 1fr); }
            .skill-row { flex-direction: column; align-items: flex-start; }
            .skill-row label { width: 100%; margin-bottom: 5px; }
            .skill-row .stat-group { width: 100%; justify-content: flex-start; }
            .header-wrapper { padding-top: 30px; }
        }
        @media (max-width: 480px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .grid-8 { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button onclick="saveToDB()" data-i18n="btn_save">☁️ Save to Database</button>
        <button onclick="openLoadModal()" data-i18n="btn_load">☁️ Load from Database</button>
        <button onclick="clearSheet()" style="background-color: #c0392b;" data-i18n="btn_clear">🗑️ New / Clear</button>
    </div>

    <div class="header-wrapper">
        <button class="lang-toggle" onclick="toggleLanguage()">🌐 EN/ES</button>
        <h1 data-i18n="title">Call of Cthulhu - 7th Edition</h1>
    </div>

    <div class="section-title" data-i18n="sec_investigator">Investigator Data</div>
    <div class="grid-2">
        <div class="form-group"><label data-i18n="lbl_name">Name</label><input type="text" id="charName"></div>
        <div class="form-group"><label data-i18n="lbl_player">Player</label><input type="text" id="playerName"></div>
        <div class="form-group"><label data-i18n="lbl_occupation">Occupation</label><input type="text" id="occupation"></div>
        <div class="form-group"><label data-i18n="lbl_age">Age</label><input type="number" id="age"></div>
    </div>

    <div class="section-title" data-i18n="sec_characteristics">Characteristics</div>
    <div class="grid-8">
        <div class="stat-box"><label data-i18n="stat_str">STR</label><div class="stat-group"><input type="number" id="str" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_dex">DEX</label><div class="stat-group"><input type="number" id="dex" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_int">INT</label><div class="stat-group"><input type="number" id="int" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_con">CON</label><div class="stat-group"><input type="number" id="con" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_app">APP</label><div class="stat-group"><input type="number" id="app" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_pow">POW</label><div class="stat-group"><input type="number" id="pow" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_siz">SIZ</label><div class="stat-group"><input type="number" id="siz" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_edu">EDU</label><div class="stat-group"><input type="number" id="edu" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
    </div>

    <div class="section-title" data-i18n="sec_status">Status Metrics</div>
    <div class="grid-3">
        <div class="stat-box"><label data-i18n="stat_hp">Hit Points</label><div class="stat-group"><input type="number" id="hp_current" placeholder="Cur"><input type="number" id="hp_max" placeholder="Max"></div></div>
        <div class="stat-box"><label data-i18n="stat_san">Sanity</label><div class="stat-group"><input type="number" id="san_current" placeholder="Cur"><input type="number" id="san_start" placeholder="Start"></div></div>
        <div class="stat-box"><label data-i18n="stat_mp">Magic Points</label><div class="stat-group"><input type="number" id="mp_current" placeholder="Cur"><input type="number" id="mp_max" placeholder="Max"></div></div>
        <div class="stat-box"><label data-i18n="stat_luck">Luck</label><div class="stat-group"><input type="number" id="luck" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>
        <div class="stat-box"><label data-i18n="stat_move">Move Rate</label><div class="stat-group"><input type="number" id="move"></div></div>
        <div class="stat-box"><label data-i18n="stat_build">Build</label><div class="stat-group"><input type="number" id="build"></div></div>
    </div>

    <div class="section-title" data-i18n="sec_skills">Skills</div>
    <div class="grid-3" id="skills-container"></div>
</div>

<!-- Load Modal -->
<div id="loadModal" class="modal">
    <div class="modal-content">
        <h3>Select Character to Load</h3>
        <select id="charSelect"><option>Loading characters...</option></select>
        <input type="password" id="loadPin" placeholder="Enter PIN / Password">
        <div class="modal-buttons">
            <button onclick="executeLoad()">Load</button>
            <button onclick="closeModal()" style="background-color: #7f8c8d;">Cancel</button>
        </div>
    </div>
</div>

<script>
    // FIX: Render UI logic first so HTML works even if Database fails.
    let currentLang = 'en';

    const dict = {
        "en": { "title": "Call of Cthulhu - 7th Edition", "btn_save": "☁️ Save to DB", "btn_load": "☁️ Load from DB", "btn_clear": "🗑️ New / Clear", "sec_investigator": "Investigator Data", "sec_characteristics": "Characteristics", "sec_status": "Status Metrics", "sec_skills": "Skills", "lbl_name": "Name", "lbl_player": "Player", "lbl_occupation": "Occupation", "lbl_age": "Age", "stat_str": "STR", "stat_dex": "DEX", "stat_int": "INT", "stat_con": "CON", "stat_app": "APP", "stat_pow": "POW", "stat_siz": "SIZ", "stat_edu": "EDU", "stat_hp": "Hit Points", "stat_san": "Sanity", "stat_mp": "Magic Points", "stat_luck": "Luck", "stat_move": "Move Rate", "stat_build": "Build" },
        "es": { "title": "La Llamada de Cthulhu - 7ª Edición", "btn_save": "☁️ Guardar en BD", "btn_load": "☁️ Cargar de BD", "btn_clear": "🗑️ Nuevo / Limpiar", "sec_investigator": "Datos del Investigador", "sec_characteristics": "Características", "sec_status": "Métricas de Estado", "sec_skills": "Habilidades", "lbl_name": "Nombre", "lbl_player": "Jugador", "lbl_occupation": "Ocupación", "lbl_age": "Edad", "stat_str": "FUE", "stat_dex": "DES", "stat_int": "INT", "stat_con": "CON", "stat_app": "APA", "stat_pow": "POD", "stat_siz": "TAM", "stat_edu": "EDU", "stat_hp": "Puntos de Vida", "stat_san": "Cordura", "stat_mp": "Puntos Magia", "stat_luck": "Suerte", "stat_move": "Movimiento", "stat_build": "Corpulencia" }
    };

    const skillsData = [
        { id: "brawl", en: "Fighting: Brawl (25%)", es: "Pelea (25%)" },
        { id: "handgun", en: "Firearms: Handgun (20%)", es: "Armas: Cortas (20%)" },
        { id: "spot", en: "Spot Hidden (25%)", es: "Descubrir (25%)" },
        { id: "stealth", en: "Stealth (20%)", es: "Sigilo (20%)" },
        { id: "library", en: "Library Use (20%)", es: "Uso de Biblioteca (20%)" },
        { id: "persuade", en: "Persuade (10%)", es: "Persuadir (10%)" }
    ]; // Add any additional skills to this array

    function renderSkills() {
        const container = document.getElementById('skills-container');
        container.innerHTML = ""; 
        skillsData.forEach(skill => {
            container.innerHTML += `
                <div class="skill-row"><label id="lbl_${skill.id}">${skill[currentLang]}</label>
                <div class="stat-group"><input type="number" id="skill_${skill.id}" class="base auto-calc"><input type="number" readonly class="derived half" tabindex="-1"><input type="number" readonly class="derived fifth" tabindex="-1"></div></div>`;
        });
        attachCalcListeners();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[currentLang][key]) {
                if (el.tagName === 'INPUT') el.placeholder = dict[currentLang][key];
                else el.innerText = dict[currentLang][key];
            }
        });
        skillsData.forEach(skill => { const label = document.getElementById(`lbl_${skill.id}`); if(label) label.innerText = skill[currentLang]; });
    }

    function attachCalcListeners() {
        document.querySelectorAll('.auto-calc').forEach(input => {
            input.addEventListener('input', function() {
                let val = parseInt(this.value) || 0;
                let group = this.parentElement;
                let halfInput = group.querySelector('.half');
                let fifthInput = group.querySelector('.fifth');
                if(halfInput) halfInput.value = this.value === "" ? "" : Math.floor(val / 2);
                if(fifthInput) fifthInput.value = this.value === "" ? "" : Math.floor(val / 5);
            });
        });
    }

    function clearSheet() {
        if(confirm(currentLang === 'en' ? "Clear sheet?" : "¿Limpiar ficha?")) {
            document.querySelectorAll('input:not([type="file"])').forEach(input => { input.value = ''; input.dispatchEvent(new Event('input')); });
        }
    }

    // Initialize UI instantly
    renderSkills();

    // --- SUPABASE SETUP ---
    // Make sure you keep the SINGLE QUOTES around your keys here
    let supabase;
    try {
        const _supabaseUrl = 'https://woncmedruwdkynifluhh.supabase.co/rest/v1/';
        const _supabaseKey = 'sb_publishable_H9v99xDm0xCIfYBAtFbJTw_y3WNz3vk';
        supabase = window.supabase.createClient(_supabaseUrl, _supabaseKey);
    } catch(err) {
        console.error("Supabase failed to initialize. Check quotes around your API keys.");
    }

    async function saveToDB() {
        if(!supabase) return alert("Database connection failed. Please check your API keys in the code.");
        const charName = document.getElementById('charName').value.trim();
        if(!charName) return alert("Please enter a Character Name first!");
        
        const pin = prompt("Enter a PIN/Password to secure this character:");
        if(!pin) return;

        const data = {};
        document.querySelectorAll('input:not(.derived)').forEach(input => {
            if (input.id && input.type !== 'password') data[input.id] = input.value;
        });

        const { data: existing } = await supabase.from('characters').select('id, char_pin').eq('char_name', charName).single();
        
        if (existing) {
            if (existing.char_pin !== pin) return alert("Incorrect PIN for this character name.");
            const { error } = await supabase.from('characters').update({ sheet_data: data }).eq('id', existing.id);
            if (error) alert("Error updating: " + error.message);
            else alert("Character updated successfully!");
        } else {
            const { error } = await supabase.from('characters').insert([{ char_name: charName, char_pin: pin, sheet_data: data }]);
            if (error) alert("Error saving: " + error.message);
            else alert("New character saved successfully!");
        }
    }

    async function openLoadModal() {
        if(!supabase) return alert("Database connection failed. Please check your API keys in the code.");
        document.getElementById('loadModal').style.display = 'flex';
        const select = document.getElementById('charSelect');
        select.innerHTML = '<option>Loading...</option>';
        document.getElementById('loadPin').value = '';

        const { data, error } = await supabase.from('characters').select('id, char_name');
        if (error) { select.innerHTML = '<option>Error loading list</option>'; return; }
        
        select.innerHTML = '<option value="">-- Select a Character --</option>';
        data.forEach(char => {
            select.innerHTML += `<option value="${char.id}">${char.char_name}</option>`;
        });
    }

    function closeModal() { document.getElementById('loadModal').style.display = 'none'; }

    async function executeLoad() {
        const id = document.getElementById('charSelect').value;
        const pin = document.getElementById('loadPin').value;
        if(!id || !pin) return alert("Select a character and enter the PIN.");

        const { data, error } = await supabase.from('characters').select('char_pin, sheet_data').eq('id', id).single();
        if (error || !data) return alert("Character not found.");
        
        if (data.char_pin !== pin) return alert("Incorrect PIN!");

        for (const key in data.sheet_data) {
            const el = document.getElementById(key);
            if (el) {
                el.value = data.sheet_data[key];
                el.dispatchEvent(new Event('input')); 
            }
        }
        closeModal();
        alert("Character loaded!");
    }
</script>
</body>
</html>
